name: 스레드 반응 수집

on:
  schedule:
    - cron: '0 13 * * 0'   # 매주 일요일 22:00 KST (UTC 13:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (결과를 커밋하지 않음)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 반응 수집
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python insights.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "khs-factory-bot"
          git config user.email "khs-factory-bot@users.noreply.github.com"
          git add -A reports
          git diff --cached --quiet && exit 0
          git commit -m "반응 수집 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
