name: 스레드 자동 발행

on:
  schedule:
    - cron: '*/30 6-15 * * *'   # UTC 06:00~15:30 = KST 15:00~00:30, 30분마다 깨움. GitHub 예약은 4~6시간 늦게 돌 때가 많아서 여러 번 깨운다.
                                 # 실제 발행은 publish.py가 그날 목표 시각(21:00~22:50 무작위)이 지난 첫 실행에서 1건만.
                                 # [11-12] 주 발행은 가게 노트북(local_publish.py). 여기는 예비 — 목표 시각 + 60분 지나도 안 올라갔을 때만.
  workflow_dispatch: {}          # 수동 실행 버튼 = 목표 시각 무시하고 바로 1건

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 발행
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          GRACE_MIN: '60'
        run: python publish.py
      - name: 발행 기록 저장
        if: always()
        run: |
          git config user.name "khs-factory-bot"
          git config user.email "khs-factory-bot@users.noreply.github.com"
          git add -A queue done
          git diff --cached --quiet || (git commit -m "발행 기록 $(date -u +%F)" && (git pull --rebase origin main || true) && git push)
